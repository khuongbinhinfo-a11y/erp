name: ERP Android T3-C v6 R2 immutable staging
on:
  workflow_run:
    workflows: ['ERP Android signed release']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  issues: write
  id-token: write
concurrency:
  group: erp-android-t3c-v6-stage
  cancel-in-progress: false
jobs:
  stage:
    if: >-
      github.repository == 'khuongbinhinfo-a11y/erp' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: android-r2-publish
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNED_RUN: ${{ github.event.workflow_run.id }}
      SIGNED_CONTEXT_SHA: ${{ github.event.workflow_run.head_sha }}
      SIGNER: '545d17fc51c8d24de4d73cb84ff7c3953f79c7d14efc7ada29b7075110d0c028'
      OIDC_AUD: 'erp-android-r2-stage-v6'
      UPLOADER: 'https://erp-android-r2-stage-v6.gustavjung24.workers.dev'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify reviewed CI, exact release run and original signer
        id: verify
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SIGNED_CONTEXT_SHA"
          [[ "$SIGNED_CONTEXT_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN" > "$RUNNER_TEMP/t3c-signed-run.json"
          jq -e --arg sha "$SIGNED_CONTEXT_SHA" '.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .event == "workflow_run" and .path == ".github/workflows/erp-android-release.yml"' "$RUNNER_TEMP/t3c-signed-run.json" >/dev/null
          gh run download "$SIGNED_RUN" --repo "$GITHUB_REPOSITORY" -n erp-android-signed -D signed
          SIGNED_SHA="$(cat signed/commit.txt)"
          [[ "$SIGNED_SHA" =~ ^[a-f0-9]{40}$ ]]
          commit_message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SIGNED_SHA" --jq '.commit.message')"
          if [[ "$commit_message" != *'[erp-apk-t3c-v6]'* ]]; then
            echo "ERP_T3C_V6_STAGE_SKIPPED_UNRELATED_SIGNED_RELEASE source=$SIGNED_SHA"
            echo 'stage=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'stage=true' >> "$GITHUB_OUTPUT"
          ci_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SIGNED_SHA&event=push&status=success" --jq '.workflow_runs[0].id')"
          test -n "$ci_run"
          test "$ci_run" != null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name' > "$RUNNER_TEMP/t3c-ci-jobs"
          for job in backend-types-and-unit postgres-fresh-schema prisma-compute-build-only \
            verify-db-isolation-and-ci-gated-release flutter-analyze-widget \
            flutter-android-native-build flutter-windows-native-build; do
            grep -Fxq "$job" "$RUNNER_TEMP/t3c-ci-jobs"
          done
          printf 'SIGNED_SHA=%s\n' "$SIGNED_SHA" >> "$GITHUB_ENV"
          test "$(cat signed/signer.txt)" = "$SIGNER"
          (cd signed && sed 's|signed/||g' SHA256SUMS | sha256sum -c -)
          test -s signed/erp.apk
          test -s signed/erp.aab
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          bash apps/flutter/platform/verify_android_signed.sh signed/erp.apk "$tools" vn.erpdistribution.erp_distribution 6 0.6.0 "$SIGNER"
      - name: Stage immutable APK v6 using protected GitHub OIDC and full R2 readback
        id: upload
        if: steps.verify.outputs.stage == 'true'
        run: |
          set -euo pipefail
          sha="$(sha256sum signed/erp.apk | cut -d' ' -f1)"
          bytes="$(wc -c < signed/erp.apk | tr -d ' ')"
          test "$bytes" -gt 1000
          test "$bytes" -le 314572800
          oidc="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUD" | jq -er '.value')"
          test -n "$oidc"
          curl --silent --show-error --fail-with-body --retry 2 \
            -H "Authorization: Bearer $oidc" \
            -H "X-ERP-SHA256: $sha" \
            -H "X-ERP-SIGNER-SHA256: $SIGNER" \
            -H "X-ERP-SOURCE-SHA: $SIGNED_SHA" \
            -H "X-ERP-VERSION-CODE: 6" \
            -H "X-ERP-VERSION-NAME: 0.6.0" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -X PUT --data-binary @signed/erp.apk "$UPLOADER/uat/0.6.0/upload"
          curl --silent --show-error --fail-with-body --retry 2 \
            -H "Authorization: Bearer $oidc" \
            -H "X-ERP-SOURCE-SHA: $SIGNED_SHA" \
            "$UPLOADER/uat/0.6.0/readback" -o "$RUNNER_TEMP/erp-t3c-v6-readback.apk"
          test "$(wc -c < "$RUNNER_TEMP/erp-t3c-v6-readback.apk" | tr -d ' ')" = "$bytes"
          test "$(sha256sum "$RUNNER_TEMP/erp-t3c-v6-readback.apk" | cut -d' ' -f1)" = "$sha"
          echo "ERP_T3C_V6_R2_READBACK_PASS key=releases/6/erp-6.apk bytes=$bytes sha256=$sha source=$SIGNED_SHA"
      - name: Record stage evidence; never update latest.json
        if: always() && steps.verify.outputs.stage == 'true'
        env:
          STAGE_STATUS: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          {
            printf 'ERP T3-C APK 0.6.0 signed R2 staging: **%s**\n\n' "$STAGE_STATUS"
            printf -- '- Source SHA: %s; signed run: %s\n' "$SIGNED_SHA" "$SIGNED_RUN"
            printf -- '- [Staging run](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- Immutable key: `releases/6/erp-6.apk`\n'
            if [[ "$STAGE_STATUS" == success ]]; then
              printf -- '- Full R2 byte-for-byte readback: PASS; APK signature verified\n'
            else
              printf -- '- R2 staging is NOT verified. Inspect workflow logs.\n'
            fi
            printf -- '- UAT only: latest.json unchanged. Device install and session-preservation UAT required.\n'
          } > "$RUNNER_TEMP/t3c-v6-stage.md"
          gh issue comment 46 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/t3c-v6-stage.md"
