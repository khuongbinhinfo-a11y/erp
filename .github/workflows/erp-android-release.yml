name: ERP Android signed release
on:
  # M3 one-shot signed v2: only a reviewed merge commit carrying the exact
  # marker can build after all seven main CI jobs pass. No R2 activation.
  workflow_run:
    workflows: ['ERP quality gates']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact approved main SHA after all quality gates'
        required: true
        type: string
      build_number:
        description: 'Android versionCode (positive, monotonically increasing)'
        required: true
        type: number
      version_name:
        description: 'Android versionName, e.g. 0.1.0'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: erp-android-release
  cancel-in-progress: false
jobs:
  signed-build:
    if: >-
      github.repository == 'khuongbinhinfo-a11y/erp' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[erp-apk-m3-v2]')))
    runs-on: ubuntu-latest
    environment: android-release
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.approved_sha }}
      BUILD_NUMBER: ${{ github.event_name == 'workflow_run' && '2' || inputs.build_number }}
      VERSION_NAME: ${{ github.event_name == 'workflow_run' && '0.2.0' || inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact SHA and all seven CI jobs
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            test "$APPROVED_SHA" = "$GITHUB_SHA"
          else
            test "${{ github.event.workflow_run.head_sha }}" = "$APPROVED_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$APPROVED_SHA&event=push&status=success" --jq '.workflow_runs[0].id')"
          test -n "$run"
          test "$run" != null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "success") | .name' > /tmp/erp-passed-jobs
          for job in backend-types-and-unit postgres-fresh-schema prisma-compute-build-only verify-db-isolation-and-ci-gated-release flutter-analyze-widget flutter-android-native-build flutter-windows-native-build; do
            grep -Fxq "$job" /tmp/erp-passed-jobs
          done
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build with protected ERP signing identity
        working-directory: apps/flutter
        env:
          ERP_KEYSTORE_B64: ${{ secrets.ERP_ANDROID_KEYSTORE_B64 }}
          ERP_ANDROID_STORE_PASSWORD: ${{ secrets.ERP_ANDROID_STORE_PASSWORD }}
          ERP_ANDROID_KEY_PASSWORD: ${{ secrets.ERP_ANDROID_KEY_PASSWORD }}
          ERP_ANDROID_KEY_ALIAS: ${{ secrets.ERP_ANDROID_KEY_ALIAS }}
          ERP_ANDROID_CERT_SHA256: ${{ vars.ERP_ANDROID_CERT_SHA256 }}
          ERP_PUBLIC_API_URL: ${{ vars.ERP_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          for name in ERP_KEYSTORE_B64 ERP_ANDROID_STORE_PASSWORD ERP_ANDROID_KEY_ALIAS ERP_ANDROID_CERT_SHA256 ERP_PUBLIC_API_URL; do
            test -n "${!name}"
          done
          [[ "$ERP_ANDROID_CERT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$ERP_PUBLIC_API_URL" =~ ^https://[^/]+/?$ ]]
          export ERP_ANDROID_KEYSTORE="$RUNNER_TEMP/erp-release.keystore"
          trap 'rm -f "$ERP_ANDROID_KEYSTORE"' EXIT
          umask 077
          if ! printf '%s' "$ERP_KEYSTORE_B64" | base64 --decode > "$ERP_ANDROID_KEYSTORE"; then
            echo "::error title=ERP Android signing::Keystore Base64 is invalid."
            exit 1
          fi
          # No secrets: binary size + SHA-256 allow local keystore comparison if provisioning fails.
          bytes="$(wc -c < "$ERP_ANDROID_KEYSTORE" | tr -d ' ')"
          digest="$(sha256sum "$ERP_ANDROID_KEYSTORE" | cut -d' ' -f1)"
          echo "ERP_ANDROID_KEYSTORE_READBACK bytes=$bytes sha256=$digest"
          # Pin original owner-verified PKCS12 bytes: stale/wrong B64 may contain another valid key.
          if [[ "$digest" != "92d28f3127967461d160ad01aa494084b23849e860fb800c799e6eb09ccd4450" ]]; then
            echo "::error title=ERP Android signing::Keystore bytes are not the verified original ERP release .p12; refuse to build or rotate signer."
            exit 1
          fi
          echo "ERP_ANDROID_ORIGINAL_KEYSTORE_SHA256_PASS"
          # Check the store password independently from the alias to eliminate ambiguous failures.
          if ! keytool -list -storetype PKCS12 -keystore "$ERP_ANDROID_KEYSTORE" \
            -storepass:env ERP_ANDROID_STORE_PASSWORD >/dev/null 2>&1; then
            # One-time compatibility with the two protected secrets provisioned at initial setup.
            # keytool-created PKCS12 accepts the same valid password for store and private key.
            if [[ -n "${ERP_ANDROID_KEY_PASSWORD:-}" ]] && \
              keytool -list -storetype PKCS12 -keystore "$ERP_ANDROID_KEYSTORE" \
                -storepass:env ERP_ANDROID_KEY_PASSWORD >/dev/null 2>&1; then
              export ERP_ANDROID_STORE_PASSWORD="$ERP_ANDROID_KEY_PASSWORD"
              echo "::warning title=ERP Android signing::Recovered a valid PKCS12 password from protected ERP_ANDROID_KEY_PASSWORD. Reconcile the two protected secrets before subsequent releases."
            else
              echo "::error title=ERP Android signing::Neither configured protected password opens the decoded PKCS12. Compare the SHA-256 above with the original local .p12; if equal, correct ERP_ANDROID_STORE_PASSWORD."
              exit 1
            fi
          fi
          if ! keytool -list -storetype PKCS12 -keystore "$ERP_ANDROID_KEYSTORE" \
            -storepass:env ERP_ANDROID_STORE_PASSWORD -alias "$ERP_ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=ERP Android signing::The store password is correct but ERP_ANDROID_KEY_ALIAS does not exist in the PKCS12 file."
            exit 1
          fi
          csr="$RUNNER_TEMP/erp-signing-check.csr"
          if ! keytool -certreq -storetype PKCS12 -keystore "$ERP_ANDROID_KEYSTORE" \
            -storepass:env ERP_ANDROID_STORE_PASSWORD -keypass:env ERP_ANDROID_STORE_PASSWORD \
            -alias "$ERP_ANDROID_KEY_ALIAS" -file "$csr" >/dev/null 2>&1; then
            echo "::error title=ERP Android signing::Private key is inaccessible using the keystore password."
            exit 1
          fi
          rm -f "$csr"
          cert="$(keytool -exportcert -rfc -storetype PKCS12 \
            -keystore "$ERP_ANDROID_KEYSTORE" -storepass:env ERP_ANDROID_STORE_PASSWORD \
            -alias "$ERP_ANDROID_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$cert" != "${ERP_ANDROID_CERT_SHA256,,}" ]]; then
            echo "::error title=ERP Android signing::Certificate SHA-256 does not match the protected environment variable."
            exit 1
          fi
          echo "ERP_ANDROID_PKCS12_PREFLIGHT_PASS"
          python3 platform/prepare_native.py android
          flutter pub get
          flutter build apk --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER" --dart-define="ERP_API_BASE_URL=$ERP_PUBLIC_API_URL"
          flutter build appbundle --release --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER" --dart-define="ERP_API_BASE_URL=$ERP_PUBLIC_API_URL"
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          # Fail closed with actionable signed-APK diagnostics.
          verified="$(bash platform/verify_android_signed.sh \
            "$apk" "$tools" "vn.erpdistribution.erp_distribution" \
            "$BUILD_NUMBER" "$VERSION_NAME" "$ERP_ANDROID_CERT_SHA256")"
          printf '%s\n' "$verified"
          actual="${verified##*signer=}"
          [[ "$actual" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p signed
          cp "$apk" signed/erp.apk
          cp build/app/outputs/bundle/release/app-release.aab signed/erp.aab
          sha256sum signed/erp.apk signed/erp.aab > signed/SHA256SUMS
          printf '%s\n' "$APPROVED_SHA" > signed/commit.txt
          printf '%s\n' "$actual" > signed/signer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: erp-android-signed
          path: apps/flutter/signed/
          if-no-files-found: error
          retention-days: 14
