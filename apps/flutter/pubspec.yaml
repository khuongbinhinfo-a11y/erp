publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  material_ui: ^1.11.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  file_picker: 9.2.3
  flutter:
