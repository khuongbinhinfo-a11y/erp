name: erp_distribution
description: ERP distribution Flutter shell for six independent feature modules.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  material_ui: ^1.11.1
  http: ^1.3.0
  crypto: ^3.0.6
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  idb_shim: ^2.6.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  file_picker: 9.2.3
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/login_logistics.webp
    - assets/images/erp_sidebar_logo.webp
